        function calculator(
            value1,
            value2,
            operator
        ) {
            let result = 0;
            let dec1 = value1.toString().replace(/^\d+\./, '').length;
            let dec2 = value2.toString().replace(/^\d+\./, '').length;
            let num1 = Number(value1);
            let num2 = Number(value2);
            if (operator === "+") {
                result = (num1 + num2).toFixed(
                    dec1 > dec2 ? dec1 : dec2);
            }
            else if (operator === "-") {
                result = (num1 - num2).toFixed(
                    dec1 > dec2 ? dec1 : dec2);
            }
            else if (operator === "*")
                result = parseFloat((num1 * num2).toFixed(dec1 + dec2));
            else if (operator === "/"){
                result = Math.round(num1 * 10 ** dec1) / Math.round(num2 * 10 ** dec2) * (10 ** (dec1 - dec2));
            }
            return result;
        }

        function setOptionResult(
            value1ID,
            value2ID,
            operatorID,
            resultID
        ) {
            document.getElementById(resultID).textContent = calculator(
                value1 = document.getElementById(value1ID).value,
                value2 = document.getElementById(value2ID).value,
                operator = document.getElementById(operatorID).value
            )
        }

        function setRadioResult(
            value1ID,
            value2ID,
            addID,
            subID,
            multiID,
            distID,
            resultID
        ) {
            let operator = "+";

            if (document.getElementById(addID).checked)
                operator = "+";
            else if (document.getElementById(subID).checked)
                operator = "-";
            else if (document.getElementById(multiID).checked)
                operator = "*";
            else if (document.getElementById(distID).checked)
                operator = "/";

            document.getElementById(resultID).textContent = calculator(
                value1 = document.getElementById(value1ID).value,
                value2 = document.getElementById(value2ID).value,
                operator = operator
            )
        }

        function setValueChangeOne(
            valueID,
            isAdd
        ) {
            if (isAdd)
                document.getElementById(valueID).value = Number(document.getElementById(valueID).value) + 1;
            else
                document.getElementById(valueID).value = Number(document.getElementById(valueID).value) - 1;
        }
